name: stock-research-lab

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: srl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_research_lab
      POSTGRES_USER: srl_admin
      POSTGRES_PASSWORD: ${SRL_ADMIN_PASSWORD:?Run backend scripts/configure-database.mjs first}
      SRL_APP_USER: ${SRL_APP_USER:?Database role is required}
      SRL_APP_PASSWORD: ${SRL_APP_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:${SRL_POSTGRES_PORT:?Database port is required}:5432"
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA directory beneath this mount.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-app.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srl_admin -d stock_research_lab"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
    name: srl-postgres-data

networks:
  database:
    name: srl-database
